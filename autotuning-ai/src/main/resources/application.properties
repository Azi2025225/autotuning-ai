spring.application.name=autotuning-ai
server.port=8080

# ---------- Base MySQL / MariaDB (XAMPP : utilisateur root, mot de passe vide par défaut) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autotuning_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# (dialecte détecté automatiquement : MySQL ou MariaDB/XAMPP)

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Téléversement (contrôle de taille) ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ---------- Compte administrateur initial (à changer en production) ----------
app.admin.email=${ADMIN_EMAIL:admin@autotuning.tn}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---------- IA : provider = mock | gemini | openai ----------
# La clé API se fournit UNIQUEMENT par variable d'environnement (IA_API_KEY).
app.ia.provider=${IA_PROVIDER:mock}
app.ia.api-key=${IA_API_KEY:}
app.ia.model=${IA_MODEL:}
app.ia.timeout-seconds=30

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# ---------- Authentification Google (identifiants fournis uniquement par l'environnement) ----------
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.scope=openid,profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=email
app.security.remember-me-key=${REMEMBER_ME_KEY:}

# ---------- Réinitialisation de mot de passe ----------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
app.url=${APP_URL:http://localhost:8080}

# ---------- Édition d'image par IA (Gemini) : essai d'un kit sur la photo d'une voiture ----------
# Clé fournie uniquement par variable d'environnement. Sans clé : simulation graphique de démonstration.
app.ia-image.api-key=${IA_IMAGE_API_KEY:}
app.ia-image.model=${IA_IMAGE_MODEL:gemini-2.5-flash-image}
app.ia-image.timeout-seconds=120

# ---------- Ollama (local ou cloud) : conseiller moteur (IA_PROVIDER=ollama) et vérification des photos ----------
# Local : OLLAMA_URL=http://localhost:11434 (défaut).  Cloud : OLLAMA_URL=https://ollama.com + OLLAMA_API_KEY.
app.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
app.ollama.api-key=${OLLAMA_API_KEY:}
app.ollama.text-model=${OLLAMA_TEXT_MODEL:llama3.1}
# Modèle vision : laisser vide pour désactiver la vérification des photos (ex. llama3.2-vision en local).
app.ollama.vision-model=${OLLAMA_VISION_MODEL:}
app.ollama.timeout-seconds=120

# ---------- Moteurs de référence : chargement au démarrage de data/moteurs_reference.csv (ajoute seulement les moteurs absents) ----------
app.moteurs.seed=${MOTEURS_SEED:true}
