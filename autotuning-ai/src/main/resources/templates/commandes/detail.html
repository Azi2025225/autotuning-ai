<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Commande')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>
<div class="container mt-4">
    <a th:href="@{/commandes}" class="text-secondary text-decoration-none">← Mes commandes</a>
    <h1 class="h3 mt-2">Commande n°<span th:text="${commande.id}"></span>
        <span class="badge fs-6 align-middle" th:classappend="'bg-' + ${commande.statut.couleur}" th:text="${commande.statut.libelle}"></span></h1>
    <p class="text-secondary" th:text="'Passée le ' + ${#temporals.format(commande.dateCommande, 'dd/MM/yyyy à HH:mm')}"></p>
    <div class="table-responsive at-card p-2">
        <table class="table table-dark align-middle mb-0">
            <thead><tr><th>Produit</th><th>Prix unitaire</th><th>Quantité</th><th class="text-end">Total</th></tr></thead>
            <tbody>
            <tr th:each="l : ${commande.lignes}">
                <td th:text="${l.produit.nom}"></td>
                <td th:text="${#numbers.formatDecimal(l.prixUnitaire, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'"></td>
                <td th:text="${l.quantite}"></td>
                <td class="text-end" th:text="${#numbers.formatDecimal(l.sousTotal, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'"></td>
            </tr>
            </tbody>
            <tfoot><tr><th colspan="3" class="text-end">Total</th><th class="text-end text-danger" th:text="${#numbers.formatDecimal(commande.total, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'"></th></tr></tfoot>
        </table>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
