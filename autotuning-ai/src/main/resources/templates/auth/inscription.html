<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Inscription')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="at-card p-4">
                <h1 class="h3">Créer un compte</h1>
                <form th:action="@{/inscription}" th:object="${form}" method="post" novalidate class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Prénom</label>
                        <input th:field="*{prenom}" class="form-control" th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{prenom}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nom</label>
                        <input th:field="*{nom}" class="form-control" th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nom}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Email</label>
                        <input th:field="*{email}" type="email" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Téléphone</label>
                        <input th:field="*{telephone}" class="form-control" th:classappend="${#fields.hasErrors('telephone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{telephone}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Mot de passe</label>
                        <input th:field="*{motDePasse}" type="password" class="form-control" th:classappend="${#fields.hasErrors('motDePasse')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{motDePasse}"></div>
                        <div class="form-text">8 à 72 caractères, avec au moins une lettre et un chiffre.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Confirmation</label>
                        <input th:field="*{confirmation}" type="password" class="form-control" th:classappend="${#fields.hasErrors('confirmation')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{confirmation}"></div>
                    </div>
                    <div class="col-12"><button class="btn btn-danger w-100">S'inscrire</button></div>
                </form>
                <p class="text-center small mt-3 mb-0">Déjà inscrit ? <a th:href="@{/login}" class="text-danger">Se connecter</a></p>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
