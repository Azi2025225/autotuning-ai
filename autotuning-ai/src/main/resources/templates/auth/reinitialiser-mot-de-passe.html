<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Nouveau mot de passe')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container my-5">
    <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
        <section class="at-card p-4 p-md-5">
            <h1 class="h3">Choisir un nouveau mot de passe</h1>
            <div th:unless="${tokenValide}" class="alert alert-danger">
                Ce lien est invalide, expiré ou déjà utilisé. Demandez un nouveau lien.
                <a th:href="@{/mot-de-passe-oublie}" class="alert-link">Réinitialiser le mot de passe</a>
            </div>
            <form th:if="${tokenValide}" th:action="@{/reinitialiser-mot-de-passe}" th:object="${form}" method="post" novalidate>
                <input type="hidden" name="token" th:value="${token}">
                <label class="form-label" for="motDePasse">Nouveau mot de passe</label>
                <input id="motDePasse" th:field="*{motDePasse}" type="password" class="form-control"
                       th:classappend="${#fields.hasErrors('motDePasse')} ? 'is-invalid'" autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{motDePasse}"></div>
                <div class="form-text mb-3">8 à 72 caractères, avec au moins une lettre et un chiffre.</div>
                <label class="form-label" for="confirmation">Confirmer le mot de passe</label>
                <input id="confirmation" th:field="*{confirmation}" type="password" class="form-control"
                       th:classappend="${#fields.hasErrors('confirmation')} ? 'is-invalid'" autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{confirmation}"></div>
                <button class="btn btn-danger w-100 mt-4" type="submit">Modifier le mot de passe</button>
            </form>
        </section>
    </div></div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
