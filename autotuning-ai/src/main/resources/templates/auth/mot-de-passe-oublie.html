<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Mot de passe oublié')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<main class="container my-5">
    <div class="row justify-content-center"><div class="col-md-7 col-lg-5">
        <section class="at-card p-4 p-md-5">
            <h1 class="h3">Mot de passe oublié ?</h1>
            <p class="text-secondary">Saisissez votre adresse email pour recevoir un lien de réinitialisation.</p>
            <div th:if="${message}" class="alert alert-info" role="status" th:text="${message}"></div>
            <form th:action="@{/mot-de-passe-oublie}" method="post">
                <label class="form-label" for="email">Adresse email</label>
                <input class="form-control mb-3" id="email" name="email" type="email" autocomplete="email" required>
                <button class="btn btn-danger w-100" type="submit">Envoyer le lien</button>
            </form>
            <p class="text-center small mt-3 mb-0"><a th:href="@{/login}" class="text-danger">Retour à la connexion</a></p>
        </section>
    </div></div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
