<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(active)" class="at-side p-3">

        <a th:href="@{/admin}" class="list-group-item" th:classappend="${active == 'dashboard'} ? 'active'"><i class="bi bi-speedometer2"></i> Tableau de bord</a>
