<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AutoTuning TN — accessoires automobiles, personnalisation et conseils intelligents.">
    <title th:text="${titre} + ' – AutoTuning TN'">AutoTuning TN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark at-nav sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><span class="text-danger">Auto</span>Tuning <span class="badge bg-danger">TN</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/catalogue}">Catalogue</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/modeles}">Modèles</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/avis}">Avis clients</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/ia/moteur}">IA Motorisation</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/ia/personnalisation}">Personnalisation</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/chat}"><i class="bi bi-chat-dots"></i> Assistant</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link text-warning" th:href="@{/admin}">Administration</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <label class="visually-hidden" for="language-select">Langue</label>
                <select id="language-select" class="form-select form-select-sm language-select" aria-label="Choisir la langue">
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                </select>
                <a class="btn btn-outline-light btn-sm position-relative" th:href="@{/panier}" title="Panier">
                    <i class="bi bi-cart3"></i>
                    <span th:if="${nbPanier != null and nbPanier > 0}" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" th:text="${nbPanier}">0</span>
                </a>
                <th:block sec:authorize="isAnonymous()">
                    <a class="btn btn-danger btn-sm" th:href="@{/login}">Se connecter</a>
                </th:block>
                <th:block sec:authorize="isAuthenticated()">
                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-person-circle"></i> <span sec:authentication="name" class="d-none d-md-inline">user</span></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/profil}">Mon profil</a></li>
                            <li><a class="dropdown-item" th:href="@{/commandes}">Mes commandes</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post"><button class="dropdown-item" type="submit">Se déconnecter</button></form>
                            </li>
                        </ul>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="flash" class="container mt-3">
    <div th:if="${succes}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${succes}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erreur}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="at-footer mt-5 py-4">
    <div class="container d-flex flex-column flex-md-row flex-wrap justify-content-between gap-3 small text-secondary">
        <span>© AutoTuning TN</span>
        <div class="d-flex flex-wrap gap-3">
            <a class="text-secondary text-decoration-none" href="tel:+21628022969"><i class="bi bi-telephone me-1"></i>28 022 969</a>
            <a class="text-secondary text-decoration-none" href="mailto:autotuning2026@gmail.com"><i class="bi bi-envelope me-1"></i>autotuning2026@gmail.com</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/language.js}" defer></script>
</footer>

</body>
</html>
