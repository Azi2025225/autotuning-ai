<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Erreur')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container my-5 text-center">
    <i class="bi bi-exclamation-triangle text-danger display-3"></i>
    <h1 class="h3 mt-3" th:text="${titre} ?: 'Une erreur est survenue'">Erreur</h1>
    <p class="text-secondary" th:text="${message} ?: 'Veuillez réessayer plus tard.'"></p>
    <a class="btn btn-danger" th:href="@{/}">Retour à l'accueil</a>
</div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
