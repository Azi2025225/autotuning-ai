<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Panier')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>
<div class="container mt-4">
    <h1 class="h3 mb-3">Mon panier</h1>
    <div th:if="${#lists.isEmpty(lignes)}" class="at-card p-4 text-center">
        <p class="mb-3">Votre panier est vide.</p>
        <a class="btn btn-danger" th:href="@{/catalogue}">Parcourir le catalogue</a>
    </div>
    <div th:unless="${#lists.isEmpty(lignes)}">
        <div class="table-responsive at-card p-2">
            <table class="table table-dark align-middle mb-0">
                <thead><tr><th>Produit</th><th>Prix unitaire</th><th style="width:170px">Quantité</th><th class="text-end">Total</th><th></th></tr></thead>
                <tbody>
                <tr th:each="l : ${lignes}">
                    <td><div class="d-flex align-items-center gap-3">
                        <img th:src="@{${l.produit.imageUrl}}" width="64" class="rounded" alt="">
                        <div><a class="text-light text-decoration-none" th:href="@{/produit/{id}(id=${l.produit.id})}" th:text="${l.produit.nom}"></a>
                            <div class="small text-secondary" th:text="'Stock : ' + ${l.produit.stock}"></div></div></div></td>
                    <td th:text="${#numbers.formatDecimal(l.produit.prix, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'"></td>
                    <td>
                        <form th:action="@{/panier/modifier}" method="post" class="input-group input-group-sm">
                            <input type="hidden" name="ligneId" th:value="${l.id}">
                            <input type="number" name="quantite" th:value="${l.quantite}" min="1" max="20" class="form-control">
                            <button class="btn btn-outline-light" title="Mettre à jour"><i class="bi bi-check2"></i></button>
                        </form>
                    </td>
                    <td class="text-end text-danger fw-bold" th:text="${#numbers.formatDecimal(l.sousTotal, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'"></td>
                    <td class="text-end">
                        <form th:action="@{/panier/retirer}" method="post"><input type="hidden" name="ligneId" th:value="${l.id}">
                            <button class="btn btn-sm btn-outline-danger" title="Retirer"><i class="bi bi-trash"></i></button></form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-3">
            <a th:href="@{/catalogue}" class="text-secondary text-decoration-none">← Continuer mes achats</a>
            <div class="text-end">
                <div class="fs-4">Total : <strong class="text-danger" th:text="${#numbers.formatDecimal(total, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'"></strong></div>
                <form th:action="@{/commandes}" method="post" class="mt-2">
                    <button class="btn btn-danger btn-lg">Passer la commande →</button>
                </form>
                <div class="small text-secondary mt-1">Paiement simulé – aucun débit réel.</div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
