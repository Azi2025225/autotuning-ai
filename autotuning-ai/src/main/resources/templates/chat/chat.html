<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Assistant')}">
</head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4" style="max-width:820px">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <h1 class="h3"><i class="bi bi-chat-dots text-danger"></i> Assistant AutoTuning</h1>
    <p class="text-secondary small">Posez vos questions sur les produits, les Stage 1/2/3, les commandes ou la compatibilité. Les conseils sont informatifs et ne remplacent pas un professionnel.</p>

    <div class="at-card p-3">
        <div id="fil" class="chat-fil mb-3" aria-live="polite">
            <div class="msg bot">Bonjour ! Comment puis-je vous aider ? Choisissez une question ci-dessous ou écrivez la vôtre.</div>
        </div>
        <div class="d-flex flex-wrap gap-2 mb-3" id="suggestions">
            <button type="button" class="at-chip border-0" th:each="s : ${suggestions}" th:text="${s}" th:attr="data-q=${s}"></button>
        </div>
        <form id="formChat" class="input-group" autocomplete="off">
            <input id="saisie" class="form-control" maxlength="500" placeholder="Écrivez votre question…" required>
            <button id="envoyer" class="btn btn-danger" type="submit"><i class="bi bi-send"></i></button>
        </form>
    </div>
</div>
<footer th:replace="~{layout :: footer}"></footer>
<script>
    var fil = document.getElementById('fil'), saisie = document.getElementById('saisie'), bouton = document.getElementById('envoyer');
    var historique = [];
    var token = document.querySelector('meta[name=_csrf]').content, entete = document.querySelector('meta[name=_csrf_header]').content;

    function bulle(texte, classe) {
        var d = document.createElement('div'); d.className = 'msg ' + classe; d.textContent = texte; // textContent : pas d'injection HTML
        fil.appendChild(d); fil.scrollTop = fil.scrollHeight; return d;
    }
    async function envoyer(texte) {
        texte = texte.trim(); if (!texte) return;
        bulle(texte, 'moi'); saisie.value = ''; bouton.disabled = true;
        var attente = bulle('…', 'bot attente');
        try {
            var h = {'Content-Type': 'application/json'}; h[entete] = token;
            var r = await fetch('/chat/message', {method: 'POST', headers: h, body: JSON.stringify({message: texte, historique: historique.slice(-6)})});
            var data = await r.json();
            if (!r.ok) { attente.textContent = data.erreur || 'Une erreur est survenue.'; attente.classList.add('erreur'); }
            else { attente.textContent = data.reponse; historique.push({role: 'user', content: texte}, {role: 'assistant', content: data.reponse}); }
        } catch (e) { attente.textContent = 'Connexion impossible. Réessayez.'; attente.classList.add('erreur'); }
        attente.classList.remove('attente'); bouton.disabled = false; saisie.focus(); fil.scrollTop = fil.scrollHeight;
    }
    document.getElementById('formChat').addEventListener('submit', function (e) { e.preventDefault(); envoyer(saisie.value); });
    document.querySelectorAll('#suggestions button').forEach(function (b) { b.addEventListener('click', function () { envoyer(b.dataset.q); }); });
</script>
</body>
</html>
