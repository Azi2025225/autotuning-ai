<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Catégories')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container-fluid mt-3"><div class="row">
    <div class="col-md-2"><div th:replace="~{fragments/sidebar :: sidebar(${section})}"></div></div>
    <main class="col-md-10">
        <div th:replace="~{layout :: flash}"></div>
        <h1 class="h3 mb-3">Catégories</h1>
        <form th:action="@{/admin/categories}" method="post" class="at-card p-3 row g-2 mb-3">
            <div class="col-md-4"><input name="nom" class="form-control" placeholder="Nom" maxlength="100" required></div>
            <div class="col-md-6"><input name="description" class="form-control" placeholder="Description" maxlength="500"></div>
            <div class="col-md-2"><button class="btn btn-danger w-100">Ajouter</button></div>
        </form>
        <div class="table-responsive at-card p-2"><table class="table table-dark align-middle mb-0">
            <thead><tr><th>Nom</th><th>Description</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${categories}">
                <td colspan="2">
                    <form th:action="@{/admin/categories}" method="post" class="row g-2">
                        <input type="hidden" name="id" th:value="${c.id}">
                        <div class="col-md-4"><input name="nom" class="form-control form-control-sm" th:value="${c.nom}" maxlength="100" required></div>
                        <div class="col-md-6"><input name="description" class="form-control form-control-sm" th:value="${c.description}" maxlength="500"></div>
                        <div class="col-md-2"><button class="btn btn-sm btn-outline-light">Modifier</button></div>
                    </form>
                </td>
                <td class="text-end">
                    <form th:action="@{/admin/categories/{id}/supprimer(id=${c.id})}" method="post" onsubmit="return confirm('Supprimer cette catégorie ?')">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
                </td>
            </tr>
            </tbody></table></div>
    </main>
</div></div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
