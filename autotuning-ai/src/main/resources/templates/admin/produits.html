<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Produits')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container-fluid mt-3"><div class="row">
    <div class="col-md-2"><div th:replace="~{fragments/sidebar :: sidebar(${section})}"></div></div>
    <main class="col-md-10">
        <div th:replace="~{layout :: flash}"></div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Produits</h1>
            <a class="btn btn-danger" th:href="@{/admin/produits/nouveau}"><i class="bi bi-plus-lg"></i> Nouveau produit</a>
        </div>
        <form th:action="@{/admin/produits}" method="get" class="d-flex flex-wrap gap-2 mb-3">
            <input name="q" class="form-control w-auto" placeholder="Rechercher un produit…" th:value="${q}">
            <select name="categorie" class="form-select w-auto" onchange="this.form.submit()">
                <option value="">Toutes les catégories</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.nom}" th:selected="${c.id == categorieId}"></option>
            </select>
            <button class="btn btn-outline-light"><i class="bi bi-search"></i></button>
            <a class="btn btn-link text-secondary" th:href="@{/admin/produits}">Réinitialiser</a>
        </form>
        <div class="table-responsive at-card p-2"><table class="table table-dark align-middle mb-0">
            <thead><tr><th></th><th>Nom</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${produits}">
                <td><img th:src="@{${p.imageUrl}}" width="48" class="rounded" alt=""></td>
                <td th:text="${p.nom}"></td>
                <td th:text="${p.categorie.nom}"></td>
                <td th:text="${#numbers.formatDecimal(p.prix, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'"></td>
                <td>
                    <form th:action="@{/admin/produits/{id}/stock(id=${p.id})}" method="post" class="d-flex gap-1" style="width:130px">
                        <input type="number" name="stock" min="0" max="100000" th:value="${p.stock}" class="form-control form-control-sm" th:classappend="${p.stock == 0} ? 'border-danger'">
                        <button class="btn btn-sm btn-outline-light" title="Enregistrer le stock"><i class="bi bi-check2"></i></button>
                    </form></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-light" th:href="@{/admin/produits/{id}/modifier(id=${p.id})}"><i class="bi bi-pencil"></i></a>
                    <form class="d-inline" th:action="@{/admin/produits/{id}/supprimer(id=${p.id})}" method="post" onsubmit="return confirm('Supprimer ce produit ?')">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(produits)}"><td colspan="6" class="text-secondary">Aucun produit trouvé.</td></tr>
            </tbody></table></div>
    </main>
</div></div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
