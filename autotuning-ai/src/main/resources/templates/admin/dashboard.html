<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Tableau de bord')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container-fluid mt-3"><div class="row">
    <div class="col-md-2"><div th:replace="~{fragments/sidebar :: sidebar(${section})}"></div></div>
    <main class="col-md-10">
        <div th:replace="~{layout :: flash}"></div>
        <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3 mb-0">Tableau de bord</h1><a class="btn btn-outline-light btn-sm" th:href="@{/admin/statistiques}"><i class="bi bi-graph-up"></i> Statistiques détaillées</a></div>
        <div class="row g-3 mb-4">
            <div class="col-6 col-lg-3"><div class="at-card p-3"><div class="text-secondary small">Produits</div><div class="fs-2 fw-bold" th:text="${nbProduits}">0</div></div></div>
            <div class="col-6 col-lg-3"><div class="at-card p-3"><div class="text-secondary small">Commandes</div><div class="fs-2 fw-bold" th:text="${nbCommandes}">0</div></div></div>
            <div class="col-6 col-lg-3"><div class="at-card p-3"><div class="text-secondary small">Utilisateurs</div><div class="fs-2 fw-bold" th:text="${nbClients}">0</div></div></div>
            <div class="col-6 col-lg-3"><div class="at-card p-3"><div class="text-secondary small">Revenus</div><div class="fs-2 fw-bold text-danger" th:text="${#numbers.formatDecimal(ca, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'">0 DT</div></div></div>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-6 col-lg-3"><div class="at-card p-3"><div class="text-secondary small">Analyses moteur IA</div><div class="fs-4 fw-bold" th:text="${nbConsultations}">0</div></div></div>
            <div class="col-6 col-lg-3"><div class="at-card p-3"><div class="text-secondary small">Essais de kits</div><div class="fs-4 fw-bold" th:text="${nbPersonnalisations}">0</div></div></div>
            <div class="col-12 col-lg-6" th:if="${!#lists.isEmpty(stockFaible)}"><div class="at-card p-3 border-warning">
                <div class="small text-warning mb-1"><i class="bi bi-exclamation-triangle"></i> Stock faible</div>
                <a class="badge bg-dark border text-decoration-none me-1" th:each="p : ${stockFaible}" th:href="@{/admin/produits/{id}/modifier(id=${p.id})}" th:text="${p.nom} + ' (' + ${p.stock} + ')'"></a>
            </div></div>
        </div>
        <div class="row g-3">
            <div class="col-lg-8">
                <div class="at-card p-3">
                    <h2 class="h6">Commandes récentes</h2>
                    <div class="table-responsive"><table class="table table-dark align-middle mb-0 small">
                        <thead><tr><th>#</th><th>Client</th><th>Date</th><th>Montant</th><th>Statut</th></tr></thead>
                        <tbody>
                        <tr th:each="c : ${recentes}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.utilisateur.nomComplet}"></td>
                            <td th:text="${#temporals.format(c.dateCommande, 'dd/MM/yyyy')}"></td>
                            <td th:text="${#numbers.formatDecimal(c.total, 1, 'WHITESPACE', 2, 'COMMA')} + ' DT'"></td>
                            <td><span class="badge" th:classappend="'bg-' + ${c.statut.couleur}" th:text="${c.statut.libelle}"></span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(recentes)}"><td colspan="5" class="text-secondary">Aucune commande.</td></tr>
                        </tbody></table></div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="at-card p-3">
                    <h2 class="h6">Produits les plus vendus</h2>
                    <ul class="list-unstyled mb-0 small">
                        <li class="d-flex justify-content-between py-1" th:each="v : ${ventes}"><span th:text="${v[0]}"></span><span class="text-secondary" th:text="${v[1]} + ' ventes'"></span></li>
                        <li th:if="${#lists.isEmpty(ventes)}" class="text-secondary">Aucune vente.</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
</div></div>
<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
